# ==============================================================================
# Outposts - Server Configuration
# Global settings for timers, visual displays, combat rules, and integrations.
# Individual outposts are configured separately in the /outposts/ folder.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System & Ticking
# ------------------------------------------------------------------------------
system:
  # Capture loop check interval in server ticks (20 ticks = 1 second)
  engine_tick_frequency: 20

  # Display refresh rate for BossBars and ActionBars (5 ticks = 4 updates per second)
  display_update_interval_ticks: 5

# ------------------------------------------------------------------------------
# 2. Visual & Display Settings
# ------------------------------------------------------------------------------
display:
  bossbar:
    # Distance in blocks to show the BossBar to players.
    #  0 = Entire server (all online players see it regardless of world or distance)
    # -1 = World only (all online players in the outpost world see it)
    # >0 = Spherical radius in blocks from the outpost center (e.g. 64)
    range_blocks: 0

  # Default distance in blocks to show border outline particles to nearby players.
  # Can be customized individually inside each outpost file.
  boundary_render_distance: 48

# ------------------------------------------------------------------------------
# 3. Gameplay Limits & Combat Rules
# ------------------------------------------------------------------------------
gameplay:
  # Limits how many outposts one team or player can hold simultaneously
  max_outposts_per_team:
    # Whether to enforce the outpost holding limit
    enabled: true
    # Maximum number of outposts a single team or player can control at once
    limit: 2
    # Cooldown in seconds before the same team can capture another outpost
    cooldown_seconds: 15

  # Default pad restrictions across all outposts (can be overridden per outpost)
  combat_restrictions:
    # Stops players from eating Chorus Fruit to teleport or escape PvP on the pad
    prevent_chorus_fruit: true

    # Stops players from flying with Elytra wings inside the capture zone
    prevent_elytra_flight: true

    # Stops players from breaking blocks inside the capture zone
    # Defaults to false so region management plugins (like WorldGuard) can handle it
    prevent_block_break: false

    # Stops players from placing blocks (e.g. cobwebs, lava, obsidian) on the pad
    # Defaults to false so region management plugins (like WorldGuard) can handle it
    prevent_block_place: false

# ------------------------------------------------------------------------------
# 4. Team & Economy Hooks
# ------------------------------------------------------------------------------
hooks:
  # Preferred team plugin for clan/faction management.
  # Options:
  #   AUTO        - Automatically detects installed plugins (ZelTeams -> BetterTeams -> Factions -> Towny -> Scoreboard)
  #   SCOREBOARD  - Built-in vanilla Minecraft scoreboard teams (no external plugins required)
  #   ZELTEAMS    - ZelTeams (supports faction bank deposits)
  #   BETTERTEAMS - BetterTeams by booksaw
  #   FACTIONS    - FactionsUUID, SaberFactions, SavageFactions
  #   TOWNY       - Towny (Towns)
  team_provider: "AUTO"

  # Towny only: Set to true to treat the whole Nation as the owner instead of individual Towns
  towny_use_nations: false

  # Maximum multiplier allowed when selling items to ShopGUIPlus (e.g. 2.5 = 250% sell price)
  shopguiplus_multiplier_cap: 2.5

# ------------------------------------------------------------------------------
# 5. Default Outpost Settings
# ------------------------------------------------------------------------------
defaults:
  # Default ownership mode when creating outposts (SOLO or TEAM)
  occupancy_mode: "SOLO"

  # Default capture mechanics strategy when omitted in '/outpost create'
  # Options: STANDARD_HILL, TUG_OF_WAR, TICKET_ACCUMULATION, PASSIVE_DECAY
  capture_mode: "STANDARD_HILL"
