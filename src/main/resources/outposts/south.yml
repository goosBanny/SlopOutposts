# ==============================================================================
# Outposts (v1.0.0) — Individual Arena Configuration
# Arena Identifier: south
# Complete showcase arena demonstrating all gameplay mechanics and options.
# ==============================================================================

# Unique alphanumeric ID for this outpost (matches the filename: south.yml)
id: "south"

# Display metadata and GUI icons
meta:
  # Display name rendered with Adventure MiniMessage format
  name: "<#F07DB5><bold>South Outpost</bold></#F07DB5>"
  # Material icon used in administrative GUIs and menus
  icon: "NETHERITE_SWORD"

# 3D Cuboid Bounding Box and Teleport Geometry
geometry:
  world: "world"
  # Set bounding_particles to true to render live RGB particle outlines connecting corners
  bounding_particles: false
  min:
    x: 362
    y: 23
    z: -1144
  max:
    x: 368
    y: 27
    z: -1138
  warp:
    x: 365.5
    y: 28.0
    z: -1141.5
    yaw: 0.0
    pitch: 0.0

# Capture Mechanics and Gameplay Parameters
mechanics:
  enabled: true
  # When true, the outpost starts active automatically without requiring a schedule or /outpost forcestart.
  auto_start: false

  # Occupancy and Contention Mode:
  # - TEAM: Outpost is captured and controlled by whole teams/factions.
  #         Teammates accelerate capture together; allies avoid stalling.
  # - SOLO: Free-for-all mode. Outpost is captured and owned by an individual player.
  occupancy_mode: "TEAM"

  # Pluggable Capture Engine Mode:
  # - STANDARD_HILL:       Classic KOTH (0% -> 100%). Invaders knock defending progress to 0% first.
  # - TUG_OF_WAR:          Symmetrical 50% midpoint anchor pulled toward extremes based on player ratio.
  # - TICKET_ACCUMULATION: Holding team generates points/tickets over time up to score cap.
  # - PASSIVE_DECAY:       Capture progress bleeds back to neutral 0% whenever the pad is vacated.
  mode: "STANDARD_HILL"

  # Capture Speed Scaling
  speed:
    # Base percentage added per second when capturing (2.5% = 40s to capture solo)
    percent_per_second: 2.5
    # Base percentage deducted per second when invading and knocking down enemy progress
    uncapture_percent_per_second: 2.5
    # Additional bonus percentage added per extra teammate standing on the capture pad
    scaling_per_member: 0.5
    # Maximum number of players counted toward capture speed calculation
    max_cappers_counted: 4

  # Capture Behavior & Fair Play Rules
  behavior:
    # If true, capture progress completely stops moving while opposing teams are both on the pad
    freeze_when_contested: true

    # When do the defenders lose their control buffs and territory multipliers?
    # - 100.0: Defenders lose control the instant an enemy knocks progress below 100%.
    # - 0.0: Defenders keep control and rewards until enemies knock progress all the way to 0%.
    # Example: If set to 100.0, any enemy stepping on the pad immediately disrupts the defending team's hold.
    lose_control_threshold: 100.0

    # How many seconds of protection the winning team gets right after capturing
    lockout_seconds: 10

    # Grace delay (in seconds) before an invading team can start knocking down defender progress
    knock_delay_seconds: 5

    # Passive decay: What happens when the pad is empty (abandoned)?
    passive_decay:
      enabled: true
      rate_per_second: 2.5

    # Anti-flicker buffer (in percent):
    # Prevents boss bars and scoreboards from flickering when enemies step on and off the edge of the pad.
    # Example: If set to 2.0, defenders won't start losing control until enemies knock progress below 98.0%.
    # This stops quick 1-tick edge taps (like 99.9%) from spamming notifications or resetting bars.
    hysteresis_buffer_percent: 2.0

    # Cooldown (in seconds) required before state changes trigger chat broadcasts.
    # Example: If set to 1.0, players must contest or leave the pad for at least 1 full second
    # before a "Contested" or "Uncontested" chat broadcast is triggered. Prevents chat spam.
    state_change_cooldown_seconds: 1.0

  # Anti-Cheese & Fair Play Rules
  anti_cheese:
    line_of_sight: true
    combat_damage_policy: "PAUSE_CAPTURE"
    combat_pause_seconds: 5
    disallow_godmode: true
    disallow_flying: true
    disallow_elytra: true
    disallow_vanished: true
    disallow_allied_stall: true

# Economy and Combat Multipliers (Applied to the controlling faction)
multipliers:
  # Mob Spawner Speed Multiplier (1.5 = spawners spawn mobs 50% faster)
  spawner_rate: 1.5
  # Hostile Mob Item Drop Multiplier (1.75 = 75% more item drops from monsters)
  mob_drop_rate: 1.75
  # Experience Drop Multiplier (2.0 = 2x experience orbs)
  exp_drop_rate: 2.0
  # PvP Damage Multiplier (1.10 = 10% bonus damage dealt in player combat)
  damage_rate: 1.10
  # ShopGUI+ Sell Boost Multiplier (1.35 = 35% higher sale prices when selling items in shop)
  shopgui_sell_rate: 1.35

# Extensible Trigger-Condition-Action (TCA) Pipeline
actions:
  on_capture:
    - type: "BROADCAST"
      message: "<prefix><white>The <#98fc98><team></#98fc98> faction has captured <#F07DB5><name></#F07DB5>!</white>"
    - type: "COMMAND_CONSOLE_PER_PLAYER"
      command: "eco give %player% 5000"
    - type: "TEAM_BANK_DEPOSIT"
      amount: 1000.0
  on_lost:
    - type: "BROADCAST"
      message: "<prefix><white>The <#98fc98><team></#98fc98> faction lost control of <#F07DB5><name></#F07DB5>!</white>"
  on_contest:
    - type: "TITLE"
      title: "<#E13148><bold>OUTPOST UNDER ATTACK</bold></#E13148>"
      subtitle: "<#CECECE>Enemy forces are contesting <#F07DB5><name></#F07DB5>!</#CECECE>"
      target: "DEFENDING_TEAM"
  on_tick_reward:
    interval_seconds: 30
    actions:
      - type: "COMMAND_CONSOLE_PER_PLAYER"
        command: "eco give %player% 500"
      - type: "TEAM_BANK_DEPOSIT"
        amount: 250.0

# ==========================================================
# Dynamic Changing Outpost Engine
# ==========================================================
# Outposts can automatically switch between multiple regions.
# You can also manage regions in-game via:
#   /outpost region add <arena> <regionId> <name> [weight]
#   /outpost region remove <arena> <regionId>
#   /outpost region list <arena>
#   /outpost region setweight <arena> <regionId> <weight>
#   /outpost region shift <arena> [regionId]
#
dynamic_locations:
  enabled: true
  # Switch Trigger Modes:
  # - INTERVAL:             Switches every switch_interval_seconds
  # - RANDOM_INTERVAL:      Switches after a random duration between min and max seconds
  # - SCHEDULED_TIMESTAMPS: Switches at specific elapsed event seconds (e.g. at 300, 600, 1200)
  # - ON_CAPTURE:           Switches only when successfully captured
  switch_mode: "INTERVAL"
  switch_interval_seconds: 300
  min_interval_seconds: 180
  max_interval_seconds: 420
  scheduled_timestamps: [ 300, 600, 900, 1200 ]
  switch_on_capture: false

  # Warnings dispatched to server before shifting (in seconds)
  warning_seconds: [ 60, 30, 10, 5, 3, 2, 1 ]

  # Warmup Delay: Seconds after shifting before capture pad activates, giving players time to adjust
  activation_grace_seconds: 15

  # Spawn Protection: Seconds of invulnerability granted to players upon warping or shifting
  warp_invincibility_seconds: 10

  # State Transition on Relocation:
  # - KEEP_PROGRESS:          Preserves existing capture percentage and controlling team
  # - RESET_PROGRESS:         Instantly resets progress to 0% and clears controller
  # - RESET_IF_UNCONTROLLED:  Keeps controller if held, but resets if neutral or capturing
  state_transition: "KEEP_PROGRESS"

  # Player Transition on Relocation:
  # - NONE:            Players remain where they were
  # - TELEPORT_TO_NEW: Players currently standing in the old capture zone are teleported to the new warp
  player_transition: "NONE"

  # Avoid choosing the exact same region twice in a row
  no_immediate_repeat: true

  # Audio and visual cues upon relocation
  effects:
    enabled: true
    sound: "ENTITY_ENDERMAN_TELEPORT"
    beacon_beam: true

  # Pool of candidate regions with chance weights: Chance = (weight / sum of all weights)
  regions:
    - id: "south_fortress"
      name: "<#F07DB5>South Fortress</#F07DB5>"
      weight: 50
      world: "world"
      min: { x: 362, y: 23, z: -1144 }
      max: { x: 368, y: 27, z: -1138 }
      warp: { x: 365.5, y: 28.0, z: -1141.5, yaw: 0.0, pitch: 0.0 }
    - id: "south_docks"
      name: "<#00B8FF>South Docks</#00B8FF>"
      weight: 35
      world: "world"
      min: { x: -200, y: 60, z: 300 }
      max: { x: -190, y: 75, z: 310 }
      warp: { x: -195.0, y: 65.0, z: 305.0, yaw: 90.0, pitch: 0.0 }
    - id: "south_ruins"
      name: "<#AA62FF>South Ruins</#AA62FF>"
      weight: 25
      world: "world"
      min: { x: 450, y: 60, z: -120 }
      max: { x: 460, y: 75, z: -110 }
      warp: { x: 455.5, y: 65.0, z: -115.5, yaw: 180.0, pitch: 0.0 }

# ==========================================================
# Per-Outpost Language & Telemetry Overrides (Optional)
# ==========================================================
# You can override ANY message, bossbar, actionbar, broadcast,
# or status chip from lang.yml specifically for this outpost.
# Leave this map empty ({}) to inherit all defaults from lang.yml.
#
# Examples:
# lang:
#   telemetry:
#     actionbar: "%state% <dark_gray>| <white>%progress%%</white> %progress_bar% <dark_gray>| <#FF6C00>%cappers% <#CECECE>competing</#CECECE>"
#     bossbar:
#       controlled: "<#00F878>🛡 [South Nexus: <#98fc98>%team%</#98fc98>]</#00F878>"
#       capturing: "<#FDC05C>▶ Capturing South Nexus</#FDC05C> <gray>▶</gray> <#98fc98>%capping%</#98fc98> <dark_gray>(<#FDC05C>%progress%%</#FDC05C>)</dark_gray>"
#       contested: "<#E13148>⚔ Nexus Under Siege</#E13148> <gray>▶</gray> <dark_gray>(<#FF6C00>%cappers% fighting<dark_gray>)</dark_gray>"
#   broadcasts:
#     milestone: "<prefix><white>The South Outpost reached %milestone%% by %team%!</white>"
#
lang: {}
