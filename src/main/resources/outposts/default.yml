# ==============================================================================
# Outposts (v1.0.0) — Exhaustive Default Arena Configuration Template
# Template Identifier: default
# Exhaustive configuration template with comprehensive inline architectural documentation.
# ==============================================================================

# Unique alphanumeric identifier for this outpost arena.
# Value Type: String (Alphanumeric, lowercase recommended). Must match filename: <id>.yml.
id: outpost

# Display metadata and administrative inventory visual representation.
meta:
  # Display name parsed via Adventure MiniMessage formatting.
  # Value Type: MiniMessage string.
  # Displayed in chat announcements, GUI menus, and scoreboards.
  name: <#E13148><bold>Outpost</bold></#E13148>
  
  # Material identifier for the menu/GUI icon.
  # Value Type: Bukkit Material enum name (e.g. NETHERITE_SWORD, BEACON, IRON_BLOCK).
  icon: NETHERITE_SWORD

# 3D Cuboid Spatial Geometry and Teleportation Coordinates.
geometry:
  # Target Bukkit World name where the capture zone exists
  world: world
  # Show live particle outlines connecting the borders of this outpost (only renders while active)
  bounding_particles: false
  # Distance in blocks for nearby players to see the boundary outline particles
  boundary_render_distance: 48
  
  # Minimum inclusive 3D block coordinate bounds of the capture zone
  min:
    x: 0
    y: 64
    z: 0
  
  # Maximum inclusive 3D block coordinate bounds of the capture zone
  max:
    x: 5
    y: 68
    z: 5
  
  # Warp / Teleportation landing position for /outpost tp <id>
  warp:
    x: 0.0
    y: 65.0
    z: 0.0
    yaw: 180.0
    pitch: 0.0

# Visual display settings
display:
  # Distance to display the BossBar for this outpost (0 = server-wide, -1 = world-wide, >0 = block radius)
  bossbar_range_blocks: 0

# Capture Mechanics, Timing, and Engine Lifecycle Parameters.
mechanics:
  # Global master toggle for this arena's capture state machine
  enabled: true
  
  # Starts active automatically on startup without needing a schedule or /outpost forcestart
  auto_start: false
  
  # SOLO (free-for-all individual players) or TEAM (factions/clans)
  occupancy_mode: SOLO
  
  # Capture strategy:
  # - STANDARD_HILL:       Classic KOTH (0% -> 100%). Invaders must knock defender progress to 0% first.
  # - TUG_OF_WAR:          Symmetrical 50% midpoint pulled back and forth based on player ratio.
  # - TICKET_ACCUMULATION: Holding team scores points/tickets over time up to target capacity.
  # - PASSIVE_DECAY:       Capture progress bleeds back to neutral 0% whenever the pad is vacated.
  mode: STANDARD_HILL
  
  # Capture Speed and Progression Mathematics
  speed:
    # Base percent captured per second when standing uncontested on the pad (2.5% = 40s to capture)
    percent_per_second: 2.5
    
    # Base percent removed per second when attackers knock down defending control
    uncapture_percent_per_second: 2.5
    
    # Extra capture percent added per second for each additional teammate on the pad
    scaling_per_member: 0.5
    
    # Maximum number of players counted for teammate speed bonuses
    max_cappers_counted: 4
  
  # Tactical behavior and fair-play anti-jitter rules
  behavior:
    # Pauses capture progress when rival players are fighting inside the pad at the same time
    freeze_when_contested: true
    
    # How far defenders must be knocked down before they lose control of the outpost.
    # Default is 100.0 (defenders must be pushed all the way down from 100% to 0% to lose control).
    # Example: If set to 60.0, attackers only need to drop the bar to 40% before the outpost neutralizes.
    lose_control_threshold: 100.0
    
    # Lockout cooldown in seconds after a capture during which the outpost cannot be contested
    lockout_seconds: 10
    
    # Grace delay in seconds before an invader can start knocking down defending progress
    knock_delay_seconds: 5
    
    # Progress bleed when a neutral pad is left unfinished
    passive_decay:
      # Whether unfinished captures bleed progress back to 0% when abandoned
      enabled: true
      # Percent drained per second when the pad is empty
      rate_per_second: 2.5
    
    # Safety buffer to stop ownership from rapidly flickering on and off near 100%.
    # Example: At 2.0%, defenders maintain full ownership until progress drops strictly below 98.0%.
    hysteresis_buffer_percent: 2.0
    
    # Stabilization delay (in seconds) required before leaving the contested combat state.
    # Example: At 1.0s, enemies must stay off the pad for a full second before the contested alert clears.
    state_change_cooldown_seconds: 1.0
  
  # Competitive Anti-Cheese Matrix.
  anti_cheese:
    # Requires unobstructed direct line of sight between the capper and the capture pad center.
    # Value Type: Boolean.
    line_of_sight: true
    
    # Policy applied when a player takes damage while capturing:
    # Value Type: String Enum:
    #   - "NONE":          Damage does not interrupt capture progress.
    #   - "PAUSE_CAPTURE": Temporarily halts capture progress for combat_pause_seconds.
    #   - "RESET_CAPTURE": Instantly resets capture progress to 0.0%.
    combat_damage_policy: PAUSE_CAPTURE
    
    # Duration of capture halt when combat_damage_policy is set to PAUSE_CAPTURE.
    # Value Type: Integer (>= 0). Units: Seconds.
    combat_pause_seconds: 5
    
    # Disallows players in Essentials / CMI / Paper invulnerable God Mode from capturing.
    # Value Type: Boolean.
    disallow_godmode: true
    
    # Disallows players with active creative/survival flight enabled from capturing.
    # Value Type: Boolean.
    disallow_flying: true
    
    # Disallows players actively gliding with Elytra wings from capturing.
    # Value Type: Boolean.
    disallow_elytra: true
    
    # Disallows vanished administrators (Essentials, SuperVanish, PremiumVanish) from capturing.
    # Value Type: Boolean.
    disallow_vanished: true
    
    # Disallows teams from using unallied secondary factions to artificially stall captures.
    # Value Type: Boolean.
    disallow_allied_stall: true

  # Per-Mode Engine Configuration Parameters.
  # Specific parameters that take effect only when the corresponding mode is selected.
  mode_settings:
    # --------------------------------------------------------------------------
    # Settings for mode: STANDARD_HILL (Classic King-of-the-Hill)
    # --------------------------------------------------------------------------
    standard_hill:
      # Minimum number of valid capper players required inside the zone to begin capturing.
      # Value Type: Integer (>= 1). Default: 1.
      min_cappers_required: 1

    # --------------------------------------------------------------------------
    # Settings for mode: TUG_OF_WAR (Symmetrical Anchor)
    # --------------------------------------------------------------------------
    tug_of_war:
      # Baseline neutral anchor midpoint where uncaptured pads start.
      # Value Type: Double (0.0 to 100.0). Default: 50.0%.
      neutral_anchor_percent: 50.0

      # Percentage pull rate multiplier added per surplus player advantage in contested battles.
      # Value Type: Double (> 0.0). Default: 0.5 (50% speed per player diff).
      contested_advantage_scaling: 0.5

      # Drift rate back toward the neutral_anchor_percent when unoccupied and neutral.
      # Value Type: Double (> 0.0). Units: Percent per second. Default: 2.5%/s.
      neutral_drift_rate: 2.5

      # Team assignment strategy:
      # - FIRST_TWO_FACTIONS: First two opposing factions to step on pad lock into Side A vs Side B duel. 3rd parties ignored.
      # - AUTO_RED_BLUE: Automatically balances players entering the zone into Red vs Blue teams. Ideal for solo/casual.
      # Value Type: String (FIRST_TWO_FACTIONS | AUTO_RED_BLUE). Default: FIRST_TWO_FACTIONS.
      team_assignment: FIRST_TWO_FACTIONS

      # Percentage deadzone buffer around the 50.0% midpoint where the outpost remains dead-center neutral.
      # Value Type: Double (>= 0.0). Default: 2.5% (Range: 47.5% - 52.5%).
      deadzone_buffer_percent: 2.5

    # --------------------------------------------------------------------------
    # Settings for mode: TICKET_ACCUMULATION (Score Goal)
    # --------------------------------------------------------------------------
    ticket_accumulation:
      # Target ticket capacity required to secure complete victory.
      # Value Type: Integer (>= 1). Default: 1000 tickets.
      target_tickets: 1000

      # Base ticket generation rate awarded per second while holding the outpost uncontested.
      # Value Type: Double (> 0.0). Units: Tickets per second. Default: 10.0 tickets/sec.
      tickets_per_second: 10.0

# Economy, Drops, and Combat Multipliers (Active while controlled).
multipliers:
  # Hostile Mob Item Drop Multiplier (1.75 = 75% more item drops from killed monsters).
  # Value Type: Double (>= 1.0).
  mob_drop_rate: 1.75
  
  # Experience Orb Drop Multiplier (2.0 = 2x experience orbs dropped).
  # Value Type: Double (>= 1.0).
  exp_drop_rate: 2.0
  
  # PvP Outgoing Damage Multiplier (1.10 = 10% bonus damage dealt in player combat).
  # Value Type: Double (>= 1.0).
  damage_rate: 1.1
  
  # ShopGUI+ Sell Value Multiplier (1.35 = 35% higher sale prices when selling items in shop).
  # Value Type: Double (>= 1.0).
  shopgui_sell_rate: 1.35

# Extensible Trigger-Condition-Action (TCA) Event Pipeline.
actions:
  # Actions executed immediately when an outpost is successfully captured (progress reaches 100%).
  on_capture:
  - type: BROADCAST
    message: <prefix><white>The <#98fc98><team></#98fc98> faction has captured <name>!</white>
  - type: COMMAND_CONSOLE_PER_PLAYER
    command: eco give %player% 5000
  - type: TEAM_BANK_DEPOSIT
    amount: 1000.0
  
  # Actions executed immediately when the controlling team loses ownership (progress reaches 0%).
  on_lost:
  - type: BROADCAST
    message: <prefix><white>The <#98fc98><team></#98fc98> faction lost control of <name>!</white>
  
  # Actions executed when an opposing team contests the outpost capture pad.
  on_contest:
  - type: TITLE
    title: <#E13148><bold>OUTPOST UNDER ATTACK</bold></#E13148>
    subtitle: <#CECECE>Enemy forces are contesting <name>!</#CECECE>
    target: DEFENDING_TEAM
  
  # Periodic interval reward actions distributed to the controlling faction.
  on_tick_reward:
    # Interval between reward distributions. Units: Seconds.
    interval_seconds: 30
    actions:
    - type: COMMAND_CONSOLE_PER_PLAYER
      command: eco give %player% 3000
    - type: TEAM_BANK_DEPOSIT
      amount: 250.0

# Dynamic Changing Outpost Engine (Dynamic Relocation Across Multiple Predefined Regions).
dynamic_locations:
  # Master toggle for automatic dynamic relocation.
  # Value Type: Boolean (true = outpost shifts locations; false = static location).
  enabled: false
  
  # Trigger Switch Mode:
  # Value Type: String Enum:
  #   - "INTERVAL":             Switches every switch_interval_seconds.
  #   - "RANDOM_INTERVAL":      Switches randomly between min_interval_seconds and max_interval_seconds.
  #   - "SCHEDULED_TIMESTAMPS": Switches at specific elapsed event seconds (e.g. 300, 600, 900).
  #   - "ON_CAPTURE":           Switches immediately upon successful capture.
  switch_mode: INTERVAL
  
  # Fixed interval in seconds when switch_mode is INTERVAL.
  # Value Type: Long (>= 10). Units: Seconds.
  switch_interval_seconds: 300
  
  # Minimum random interval when switch_mode is RANDOM_INTERVAL.
  # Value Type: Long (>= 10). Units: Seconds.
  min_interval_seconds: 180
  
  # Maximum random interval when switch_mode is RANDOM_INTERVAL.
  # Value Type: Long (> min_interval_seconds). Units: Seconds.
  max_interval_seconds: 420
  
  # List of elapsed schedule seconds when switch_mode is SCHEDULED_TIMESTAMPS.
  # Value Type: List of Integers (Units: Seconds).
  scheduled_timestamps:
  - 300
  - 600
  - 900
  - 1200
  
  # Whether to also trigger a shift immediately upon outpost capture.
  # Value Type: Boolean.
  switch_on_capture: false
  
  # Broadcast warning countdown milestones sent prior to shifting.
  # Value Type: List of Integers (Units: Seconds).
  warning_seconds:
  - 60
  - 30
  - 10
  - 5
  - 3
  - 2
  - 1
  
  # Warmup Delay: Seconds after shifting before capture pad activates, giving players time to navigate.
  # Value Type: Integer (>= 0). Units: Seconds.
  activation_grace_seconds: 15
  
  # Spawn Protection: Seconds of invulnerability granted to players upon warping or shifting.
  # Value Type: Integer (>= 0). Units: Seconds.
  warp_invincibility_seconds: 10
  
  # State Transition Policy upon Relocation:
  # Value Type: String Enum:
  #   - "KEEP_PROGRESS":          Preserves existing capture percentage and controlling team.
  #   - "RESET_PROGRESS":         Instantly resets progress to 0% and clears controller.
  #   - "RESET_IF_UNCONTROLLED":  Keeps controller if held, but resets if neutral or capturing.
  state_transition: KEEP_PROGRESS
  
  # Player Transition Policy upon Relocation:
  # Value Type: String Enum:
  #   - "NONE":            Players remain where they were.
  #   - "TELEPORT_TO_NEW": Players currently standing in the old capture zone are teleported to the new warp.
  player_transition: NONE
  
  # Prevents picking the exact same region twice consecutively.
  # Value Type: Boolean.
  no_immediate_repeat: true
  
  # Visual & Audio cues dispatched upon relocation.
  effects:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    beacon_beam: true
  
  # Pool of candidate regions with relative selection weights:
  # Chance for region R = (weight of R / sum of all weights in list).
  regions:
  - id: region_one
    name: <#E13148>Primary Citadel</#E13148>
    weight: 50
    world: world
    min:
      x: 0
      y: 64
      z: 0
    max:
      x: 10
      y: 74
      z: 10
    warp:
      x: 5.5
      y: 65.0
      z: 5.5
      yaw: 0.0
      pitch: 0.0
  - id: region_two
    name: <#00B8FF>Coastal Anchorage</#00B8FF>
    weight: 35
    world: world
    min:
      x: -150
      y: 64
      z: 200
    max:
      x: -140
      y: 74
      z: 210
    warp:
      x: -145.0
      y: 65.0
      z: 205.0
      yaw: 90.0
      pitch: 0.0

# Per-Outpost Language & Telemetry Overrides (Optional).
# You can override ANY message, bossbar, actionbar, broadcast, or status chip
# from lang.yml specifically for this outpost. Leave this empty ({}) to inherit defaults.
#
# Examples:
# lang:
#   telemetry:
#     actionbar: "%state% <dark_gray>| <white>%progress%%</white> %progress_bar% <dark_gray>| <#FF6C00>%cappers% <#CECECE>competing</#CECECE>"
#     bossbar:
#       controlled: "<#00F878>🛡 [Citadel: <#98fc98>%team%</#98fc98>]</#00F878>"
#       capturing: "<#FDC05C>▶ Capturing Citadel</#FDC05C> <gray>▶</gray> <#98fc98>%capping%</#98fc98> <dark_gray>(<#FDC05C>%progress%%</#FDC05C>)</dark_gray>"
#       contested: "<#E13148>⚔ Citadel Contested</#E13148> <gray>▶</gray> <dark_gray>(<#FF6C00>%cappers% fighting<dark_gray>)</dark_gray>"
#   broadcasts:
#     milestone: "<prefix><white>The Citadel outpost reached %milestone%% by %team%!</white>"
#
lang: {}
